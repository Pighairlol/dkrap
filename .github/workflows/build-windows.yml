name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build
        run: pyinstaller DKRapBuilder.spec
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/DKRapVocalBuilder/* -DestinationPath DKRapVocalBuilder-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DKRapVocalBuilder-Windows
          path: DKRapVocalBuilder-Windows.zip
